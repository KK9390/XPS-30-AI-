name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # Updated to v4

    - name: Set up Python
      uses: actions/setup-python@v5  # Updated to v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mido python-rtmidi pyinstaller

    - name: Compile EXE
      # Make sure this matches your exact file name!
      run: pyinstaller --onefile --noconsole --hidden-import mido.backends.rtmidi sysex_test.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: XPS30-Controller-Windows
        path: dist/sysex_test.exe
